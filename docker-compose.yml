# VansRouter Docker Compose
# Usage:
#   1. cp .env.example .env && nano .env
#   2. docker compose up -d
#   3. Open http://localhost:20128

services:
  vansrouter:
    # Local build from the repo Dockerfile (used by start.sh). The image name is
    # kept for registry-based deployments / caching; `docker compose up --build`
    # prefers the local build.
    build: .
    image: vansrouter:local
    container_name: vansrouter
    restart: unless-stopped
    ports:
      - "${PORT:-20128}:20128"
    volumes:
      - 9router-data:/app/data
      # Optional: use the host's Tailscale daemon instead of the bundled one.
      # Uncomment the line below and set TAILSCALE_USE_HOST_SOCKET=true in .env
      # - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
      # Set TAILSCALE_USE_HOST_SOCKET=true to reuse the host Tailscale daemon.
      # TAILSCALE_USE_HOST_SOCKET: "true"
    depends_on:
      headroom:
        condition: service_started
    healthcheck:
      # localhost resolves to ::1 in Alpine wget first; the server binds IPv4
      # 0.0.0.0 only, so probe 127.0.0.1 explicitly.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:20128/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: unless-stopped
    ports:
      - "${HEADROOM_PORT:-8787}:8787"
    environment:
      # Bind on all interfaces inside the container so both the vansrouter
      # service (http://headroom:8787) and host clients reach it.
      HEADROOM_HOST: 0.0.0.0
      HEADROOM_PORT: "8787"

volumes:
  9router-data:
    name: 9router-data
