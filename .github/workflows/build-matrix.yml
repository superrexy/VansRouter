name: Cross-platform build matrix

on:
  push:
    branches: [main, master, dev]
    paths:
      - "cli/**"
      - "scripts/build.js"
      - "scripts/fix-standalone-symlinks.cjs"
      - "src/lib/dataDir.js"
      - "src/lib/db/**"
      - "src/mitm/**"
      - "server.js"
      - "custom-server.js"
      - "next.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".gitattributes"
      - ".github/workflows/**"
  pull_request:
    branches: [main, master, dev]
    paths:
      - "cli/**"
      - "scripts/build.js"
      - "scripts/fix-standalone-symlinks.cjs"
      - "src/lib/dataDir.js"
      - "src/lib/db/**"
      - "src/mitm/**"
      - "server.js"
      - "custom-server.js"
      - "next.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".gitattributes"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
        # Note: setup-node's pnpm cache requires a workspace "packages" field,
        # which this repo does not use. pnpm/action-setup handles installation.

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ matrix.node }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-pnpm-

      - name: Configure pnpm hoisting config
        shell: bash
        run: |
          echo "public-hoist-pattern=*" >> .npmrc
          echo "shamefully-hoist=true" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run no-undef lint (catch undefined before build)
        run: pnpm lint:undef

      - name: Build application
        run: node scripts/build.js

      - name: Verify standalone output exists
        shell: bash
        run: |
          test -d .next/standalone
          test -f .next/standalone/server.js
